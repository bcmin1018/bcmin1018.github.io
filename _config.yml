# ==============================================================================
# Minimal Mistakes — Remote Theme 방식
# 테마 업데이트는 _config.yml의 remote_theme 버전 태그만 바꾸면 됨
# ==============================================================================

remote_theme             : "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin    : "mint" # "default", "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# ------------------------------------------------------------------------------
# 사이트 정체성 (TODO: 사용자가 직접 채워주세요)
# ------------------------------------------------------------------------------
title                    : "TODO: 새 사이트 제목"
title_separator          : "|"
description              : "TODO: 사이트 한 줄 설명 — AI 엔지니어 Brad의 기술 블로그 등"
url                      : "https://bcmin1018.github.io"
baseurl                  :
repository               : "bcmin1018/bcmin1018.github.io"
teaser                   :
logo                     :
masthead_title           : " "
words_per_minute         : 200
locale                   : "ko-KR"

# ------------------------------------------------------------------------------
# 댓글: giscus (GitHub Discussions 기반)
# 셋업: https://giscus.app 에서 repo 등록 후 받은 값 채우기
# 사전 조건: GitHub repo Settings → Discussions 활성화 + giscus app 설치
# ------------------------------------------------------------------------------
comments:
  provider               : "giscus"
  giscus:
    repo_id              : "TODO: giscus.app에서 발급"
    category_name        : "Comments"
    category_id          : "TODO: giscus.app에서 발급"
    discussion_term      : "pathname"
    reactions_enabled    : '1'
    theme                : "preferred_color_scheme"

# ------------------------------------------------------------------------------
# 검색
# ------------------------------------------------------------------------------
search                   : true
search_full_content      : true
search_provider          : lunr

# ------------------------------------------------------------------------------
# SEO (기존 등록 보존)
# ------------------------------------------------------------------------------
google_site_verification :
naver_site_verification  : "1c8b6dee558f047fe76e93c34172a395b1d65625"

# ------------------------------------------------------------------------------
# Analytics (기존 보존)
# ------------------------------------------------------------------------------
analytics:
  provider               : "google-gtag"
  google:
    tracking_id          : "G-DZLBS8LRKL"
    anonymize_ip         : false

# ------------------------------------------------------------------------------
# 작성자 프로필
# ------------------------------------------------------------------------------
author:
  name             : "Brad Min"
  avatar           : "/assets/avatar.jpg"
  bio              : "TODO: 자기소개 — 예) AI 엔지니어. LLM·Agent·RAG에 관심."
  location         : "Seoul, Korea"
  email            :
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:bcmin1018@gmail.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bcmin1018/"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bcmin1018/"

# ------------------------------------------------------------------------------
# Collections — 프로젝트 페이지 별도 운영
# ------------------------------------------------------------------------------
collections:
  project:
    output: true
    permalink: /:collection/:path/

# ------------------------------------------------------------------------------
# 파일 처리
# ------------------------------------------------------------------------------
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Capfile
  - config
  - Gemfile
  - Gemfile.lock
  - log
  - node_modules
  - tmp
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# ------------------------------------------------------------------------------
# 변환
# ------------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed

# ------------------------------------------------------------------------------
# URL / 페이지네이션
# ------------------------------------------------------------------------------
permalink: /:categories/:title/
paginate: 7
paginate_path: /page:num/
timezone: Asia/Seoul

# ------------------------------------------------------------------------------
# 플러그인
# ------------------------------------------------------------------------------
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

# ------------------------------------------------------------------------------
# Archives (카테고리/태그 인덱스)
# ------------------------------------------------------------------------------
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# ------------------------------------------------------------------------------
# HTML 압축
# ------------------------------------------------------------------------------
compress_html:
  clippings: all
  ignore:
    envs: development

# ------------------------------------------------------------------------------
# 글 기본값
# ------------------------------------------------------------------------------
defaults:
  # 일반 글
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      toc: true
      toc_sticky: true
  # 프로젝트 컬렉션
  - scope:
      path: ""
      type: project
    values:
      layout: single
      author_profile: true
      share: true
  # archive 카테고리 글 (2022년 이전 자료) — 댓글 비활성, related 비활성
  - scope:
      path: "_posts/archive"
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: false
      classes: archive-post
