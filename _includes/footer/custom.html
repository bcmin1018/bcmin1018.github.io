<!-- mermaid 다이어그램 렌더링: ```mermaid 코드 블록이 있는 페이지에서만 로드 -->
<script type="module">
  if (document.querySelector('div.language-mermaid')) {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
    document.querySelectorAll('div.language-mermaid').forEach(function (el) {
      var pre = document.createElement('pre');
      pre.className = 'mermaid';
      pre.textContent = el.textContent;
      el.replaceWith(pre);
    });
    mermaid.initialize({ startOnLoad: false, theme: 'neutral' });
    mermaid.run();
  }
</script>

<!-- GoatCounter 방문 통계 (https://bcmin1018.goatcounter.com) -->
<script data-goatcounter="https://bcmin1018.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<!-- 방문자 수 표시: 대시보드 설정에서 'allow using the visitor counter'가 켜져 있어야 함.
     JS가 카운트 로드 후 footer 맨 아래(copyright 다음)로 옮겨 왼쪽 정렬로 표시한다. -->
<style>
  #visitor-stats {
    display: none;
    margin-top: 0.75em;
    text-align: left;
  }
  #visitor-stats .vs-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4em;
    margin-right: 0.4em;
    padding: 0.3em 0.8em;
    border: 1px solid #e0e4e6;
    border-radius: 2em;
    background: #f6f8f8;
    font-size: 0.7em;
    color: #6f777d;
  }
  #visitor-stats .vs-pill i {
    color: #3fb0ac;
  }
  #visitor-stats .vs-pill strong {
    color: #3d4144;
    font-weight: 600;
  }
  .page__meta-views {
    margin-left: 0.75em;
  }
</style>
<div id="visitor-stats">
  <span class="vs-pill"><i class="fas fa-fw fa-eye" aria-hidden="true"></i>Total <strong id="vs-total"></strong></span>
  <span class="vs-pill"><i class="fas fa-fw fa-calendar-day" aria-hidden="true"></i>Today <strong id="vs-today"></strong></span>
</div>
<script>
  (function () {
    var counter = 'https://bcmin1018.goatcounter.com/counter/';
    var base = counter + 'TOTAL.json';
    var today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });

    function getCount(url) {
      return fetch(url)
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) { return parseInt(d.count.replace(/\D/g, ''), 10) || 0; });
    }

    function show(counts) {
      var stats = document.getElementById('visitor-stats');
      document.getElementById('vs-total').textContent = counts[0].toLocaleString();
      document.getElementById('vs-today').textContent = counts[1].toLocaleString();
      var copyright = document.querySelector('.page__footer-copyright');
      if (copyright) copyright.insertAdjacentElement('afterend', stats);
      stats.style.display = 'block';
    }

    Promise.all([getCount(base), getCount(base + '?start=' + today)])
      .then(function (counts) {
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () { show(counts); });
        } else {
          show(counts);
        }
      })
      .catch(function () { /* 카운터 비활성/네트워크 오류 시 표시 생략 */ });

    // 글 페이지: 제목 아래 메타(읽는 시간 옆)에 해당 글 조회수 표시
    var readtime = document.querySelector('.page__meta .page__meta-readtime');
    if (readtime) {
      getCount(counter + encodeURIComponent(location.pathname) + '.json')
        .then(function (n) {
          var span = document.createElement('span');
          span.className = 'page__meta-views';
          span.innerHTML = '<i class="far fa-fw fa-eye" aria-hidden="true"></i> ' +
            n.toLocaleString() + ' views';
          readtime.insertAdjacentElement('afterend', span);
        })
        .catch(function () { /* 집계 전이거나 오류면 표시 생략 */ });
    }
  })();
</script>
